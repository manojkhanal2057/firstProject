<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beginner API Project: Joke Finder</title>
  <style>
    /* Reset and Core Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Card Container */
    .card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      padding: 40px 30px;
      text-align: center;
    }

    /* Typography */
    h1 {
      color: #333333;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666666;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    /* Joke Content Display Area */
    .joke-display {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
      padding: 15px;
      background-color: #f9f9f9;
      border-radius: 8px;
      border-left: 5px solid #4a90e2;
    }

    .setup-text {
      font-size: 1.2rem;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.4;
    }

    .punchline-text {
      font-size: 1.15rem;
      color: #27ae60;
      font-weight: 700;
      margin-top: 15px;
      line-height: 1.4;
      transition: all 0.3s ease;
    }

    /* Interactive Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      font-size: 1rem;
      font-weight: 600;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      width: 100%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation; /* Optimizes mobile tap delay */
    }

    button:active {
      transform: scale(0.98);
    }

    .primary-btn {
      background-color: #4a90e2;
      color: #ffffff;
    }

    .primary-btn:hover {
      background-color: #357abd;
    }

    .secondary-btn {
      background-color: #27ae60;
      color: #ffffff;
    }

    .secondary-btn:hover {
      background-color: #219653;
    }

    /* Dynamic classes to control visibility via JS */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>😄 Joke Finder</h1>
    <p class="subtitle">Fetch a live joke using JavaScript async/await APIs</p>
    
    <div class="joke-display">
      <!-- The element where the joke setup goes -->
      <p id="joke-setup" class="setup-text">Click the button below to fetch a joke!</p>
      
      <!-- The element where the joke punchline goes (hidden initially) -->
      <p id="joke-punchline" class="punchline-text hidden"></p>
    </div>

    <div class="btn-group">
      <!-- Button to reveal the hidden punchline -->
      <button id="reveal-btn" class="secondary-btn hidden">👀 Reveal Punchline</button>
      
      <!-- Button to trigger the initial API fetch call -->
      <button id="joke-btn" class="primary-btn" >🔄 Get New Joke</button>
    </div>
  </div>

 <script>
    // 1. Match the exact IDs from your HTML
    const setupElement = document.getElementById('joke-setup');
    const punchlineElement = document.getElementById('joke-punchline');
    const jokeBtn = document.getElementById('joke-btn');
    const revealBtn = document.getElementById('reveal-btn');

    // 2. Fetch the joke from the internet
    async function getJoke() {
      try {
        // Changed to the setup text to show loading state
        setupElement.textContent = "Loading joke...";
        punchlineElement.classList.add('hidden');
        revealBtn.classList.add('hidden');

        // Added the full, correct API URL
        const response = await fetch('https://official-joke-api.appspot.com/random_joke');
        const data = await response.json();
        
        // Show the setup, prepare the punchline
        setupElement.textContent = data.setup;
        punchlineElement.textContent = data.punchline;
        
        // Show the reveal button using your CSS class
        revealBtn.classList.remove('hidden');
      } catch (error) {
        // Add basic error handling just in case the API goes down
        setupElement.textContent = "Oops! Couldn't fetch a joke. Please try again.";
        console.error("Error fetching joke:", error);
      }
    }

    // 3. Toggle the punchline view
    revealBtn.addEventListener('click', () => {
      // Use your existing .hidden class to toggle visibility
      punchlineElement.classList.remove('hidden');
      revealBtn.classList.add('hidden');
    });

    // 4. Attach the click event to the main button
    jokeBtn.addEventListener('click', getJoke);
  </script>
</body>
</html>
